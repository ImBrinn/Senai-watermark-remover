[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "senai-watermark-remover"
dynamic = ["version"]
description = "Remove the SenAI branding from PDFs, add your own title, and fix SenAI's typesetting"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
# Qt 6.8 is a long-term-support release; 6.9+ needs Windows' own ICU
# library at runtime, which older systems (and Wine) lack.
gui = ["PySide6-Essentials>=6.8,<6.9"]
test = ["pytest"]

[project.scripts]
senai-remover = "senai_remover.cli:main"

[project.gui-scripts]
senai-remover-gui = "senai_remover.gui:main"

[tool.setuptools]
packages = ["senai_remover", "senai_remover.gui", "senai_remover.gui.designs"]

[tool.setuptools.package-data]
"senai_remover.gui" = ["assets/app.png", "assets/app.ico", "assets/fonts/*", "assets/icons/*", "assets/previews/*"]

[tool.setuptools.dynamic]
version = { attr = "senai_remover.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
