name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui,test]"
      - run: pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[gui,test]" pyinstaller
      - name: Tests on Windows
        run: pytest -q
      - name: Build
        run: >-
          python tools/make_version_info.py build/version_info.txt &&
          pyinstaller --onefile --windowed --name SenAI-Watermark-Remover
          --version-file build/version_info.txt
          --icon senai_remover/gui/assets/app.ico
          --add-data "senai_remover/gui/assets:senai_remover/gui/assets"
          --paths . senai_remover/__main__.py
      - name: Version details
        shell: pwsh
        run: |
          $info = (Get-Item dist/SenAI-Watermark-Remover.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileDescription, FileVersion, LegalCopyright
          $version = python -c "import senai_remover; print(senai_remover.__version__)"
          if ($info.ProductName -ne "SenAI Watermark Remover") { throw "Wrong product name: $($info.ProductName)" }
          if ($info.ProductVersion -ne $version) { throw "Wrong version: $($info.ProductVersion), expected $version" }
      - name: Smoke test
        shell: pwsh
        run: |
          Copy-Item tests/fixtures/senai_sample.pdf sample.pdf
          python -m senai_remover sample.pdf
          if (-not (Test-Path sample-clean.pdf)) { throw "CLI produced no output" }
      - uses: actions/upload-artifact@v4
        with:
          name: SenAI-Watermark-Remover-windows
          path: dist/SenAI-Watermark-Remover.exe
