name: Release

# Builds the Windows app for a version tag and publishes it as a GitHub
# release, with notes taken from CHANGELOG.md. Runs on every v* tag push,
# or by hand (Actions → Release → Run workflow) for any tags, or "all" for
# every version in CHANGELOG.md. A version without a tag yet is tagged at
# the first commit on the default branch with that __version__ (the merge
# that released it). Re-running is safe:
# an existing release gets its notes and .exe replaced.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags to publish, separated by spaces, or "all"'
        required: true
        default: all

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.list.outputs.tags }}
      newest: ${{ steps.list.outputs.newest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        env:
          WANTED: ${{ github.event_name == 'push' && github.ref_name || inputs.tags }}
        run: |
          if [ "$WANTED" = "all" ]; then
            tags=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^/v/')
          else
            tags="$WANTED"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $tags; do
            git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null && continue
            version="${tag#v}"
            # The first commit on the default branch (following merges, so
            # usually the release PR's merge) that carries this version.
            commit=""
            for c in $(git rev-list --first-parent --reverse HEAD); do
              if git show "$c:senai_remover/__init__.py" 2>/dev/null | grep -qF "__version__ = \"$version\""; then
                commit=$c
                break
              fi
            done
            [ -n "$commit" ] || { echo "::error::No tag $tag, and no commit on this branch has version $version"; exit 1; }
            git tag -a "$tag" "$commit" -m "SenAI Watermark Remover $tag"
            git push origin "refs/tags/$tag"
            echo "Tagged $tag at $commit"
          done
          tags=$(printf '%s\n' $tags | sort -V)
          echo "tags=$(printf '%s\n' $tags | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "newest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.plan.outputs.tags) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: |
          if (Test-Path senai_remover/gui/assets) {
            # v2 and later: the Qt app and its bundled fonts, icons and previews.
            pip install ".[gui]" pyinstaller
            # The product name and version in the .exe's details (needed for
            # code signing). Tags before this tool existed build without them.
            $details = @()
            if (Test-Path tools/make_version_info.py) {
              python tools/make_version_info.py build/version_info.txt
              $details = @("--version-file", "build/version_info.txt")
            }
            pyinstaller --onefile --windowed --name SenAI-Watermark-Remover @details `
              --icon senai_remover/gui/assets/app.ico `
              --add-data "senai_remover/gui/assets:senai_remover/gui/assets" `
              --paths . senai_remover/__main__.py
          } else {
            # v1: the Tkinter window.
            pip install . pyinstaller
            pyinstaller --onefile --windowed --name SenAI-Watermark-Remover --paths . senai_remover/__main__.py
          }
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.tag }}
          path: dist/SenAI-Watermark-Remover.exe

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        tag: ${{ fromJson(needs.plan.outputs.tags) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # the current CHANGELOG.md
      - uses: actions/download-artifact@v4
        with:
          name: exe-${{ matrix.tag }}
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          NEWEST: ${{ needs.plan.outputs.newest }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SenAI Watermark Remover $TAG" > notes.md
          latest=false
          [ "$TAG" = "$NEWEST" ] && latest=true
          title="SenAI Watermark Remover $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SenAI-Watermark-Remover.exe --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md --latest="$latest"
          else
            gh release create "$TAG" dist/SenAI-Watermark-Remover.exe --verify-tag \
              --title "$title" --notes-file notes.md --latest="$latest"
          fi
